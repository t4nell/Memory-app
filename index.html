<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>memory app</title>
</head>
<body>

    <div id="app">
        <section id="home-screen" class="screen active">
            <div class="home-content">
                <div class="home-text">
                    <p>It's play time.</p>
                    <h1>Ready to play?</h1>
                </div>
                <div class="home-actions">
                    <button class="play-btn"></button>
                </div>
            </div>
            <img class="home-corner-img" src="/assets/images/main_page_images/mainPageContoller.png" alt="Controller">
        </section>

        <section id="settings-screen" class="screen">
            <div class="settings-content">
                <h2 class="settings-title">Settings</h2>
                <div class="settings-body">
                    <div class="settings-options">
                        <form class="settings-group" id="theme-group" autocomplete="off">
                            <h2><img src="/assets/images/settings_screen_icons/gameThemesIcon.png" alt="" class="settings-icon"> Game themes</h2>
                            <label><input type="radio" name="theme" value="code_vibes" checked> Code vibes</label>
                            <label><input type="radio" name="theme" value="gaming"> Gaming</label>
                            <label><input type="radio" name="theme" value="da_projects"> DA Projects</label>
                            <label><input type="radio" name="theme" value="foods"> Food</label>
                        </form>
                        <form class="settings-group" id="player-group" autocomplete="off">
                            <h2><img src="/assets/images/settings_screen_icons/choosePlayerIcon.png" alt="" class="settings-icon"> Choose player</h2>
                            <label><input type="radio" name="player" value="blue"> Blue</label>
                            <label><input type="radio" name="player" value="orange"> Orange</label>
                        </form>

                        <form class="settings-group" id="boardsize-group" autocomplete="off">
                            <h2><img src="/assets/images/settings_screen_icons/boardSizeIcon.png" alt="" class="settings-icon"> Board size</h2>
                            <label><input type="radio" name="boardsize" value="16" checked> 16 cards</label>
                            <label><input type="radio" name="boardsize" value="24"> 24 cards</label>
                            <label><input type="radio" name="boardsize" value="36"> 36 cards</label>
                        </form>
                    </div>
                    <div class="settings-right">
                        <div class="settings-preview">
                            <img id="theme-preview-img" src="/assets/images/themes/theme_version/codeVibes.png" alt="Theme Preview">
                        </div>
                        <nav class="settings-nav">
                            <span class="nav-item" id="nav-theme"></span>
                            <span class="nav-separator"></span>
                            <span class="nav-item" id="nav-player">Player</span>
                            <span class="nav-separator"></span>
                            <span class="nav-item" id="nav-boardsize">Board size</span>
                            <button class="start-btn" id="start-btn" disabled></button>
                        </nav>
                    </div>
                </div>  
            </div>
        </section>

        <section id="game-screen" class="screen">
            <div class="game-content">
                <div class="game-header">
                    <div class="game-score">
                        <span class="score blue">
                            <img id="score-blue-icon" class="score-icon" src="" alt="blue">
                            <span id="score-blue">0</span>
                        </span>
                        <span class="score orange">
                            <img id="score-orange-icon" class="score-icon" src="" alt="orange">
                            <span id="score-orange">0</span>
                        </span>
                    </div>
                    <div class="game-current-player">
                        Current player: <div class="playerIconContainer"><img id="current-player-icon" class="player-icon" src="" alt="player"></div>
                    </div>
                    <button class="exit-btn" id="exit-btn">
                        <img id="exit-btn-img" src="" alt="exit">
                    </button>
                </div>

                <div class="game-board" id="game-board"></div>

                <template id="card-template">
                    <div class="card">
                        <img class="card-back" />
                        <img class="card-front" />
                    </div>
                </template>

            </div>
        </section>

        <section id="gameover-screen" class="screen">
            <div class="gameover-content">
                <h3 id="gameover-title">Game over</h3>
                <div id="gameover-finalscore-label">Final score</div>
                <div id="gameover-score-box">
                    <span id="gameover-score-blue-box" class="score blue">
                        <img id="gameover-score-blue-icon" class="score-icon" src="/assets/images/themes/code_vibes_theme/gamePointCounterBlue.png" alt="blue">
                        <span id="gameover-score-blue">0</span>
                    </span>
                    <span id="gameover-score-orange-box" class="score orange">
                        <img id="gameover-score-orange-icon" class="score-icon" src="/assets/images/themes/code_vibes_theme/gamePointCounterOrange.png" alt="orange">
                        <span id="gameover-score-orange">0</span>
                    </span>
                </div>
            </div>
        </section>

        <section id="win-screen" class="screen">
            <div class="win-content">
                <img id="win-top-image" class="win-top-image" src="" alt="">
                <p class="win-subtitle">The winner is</p>
                <h2 id="win-player-name" class="win-player-name"></h2>
                <img id="win-player-icon" class="win-player-icon" src="" alt="Winner">
                <button class="win-back-btn" id="win-back-btn">
                    <img id="win-back-btn-img" src="" alt="Back">
                </button>
            </div>
        </section>   

    </div>

    <div id="popup-overlay" class="popup-overlay"></div>
    <div id="quit-popup" class="popup">
        <div class="popup-content">
            <h3 class="popupText">Are you sure you want to quit the game?</h3>
            <div class="popup-actions">
                <button class="popup-btn-border"><img id="popup-back-btn" class="popup-btn-img" src="" alt="Back to game"></button>
                <button class="popup-btn-border"><img id="popup-exit-btn" class="popup-btn-img" src="" alt="Exit game"></button>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
